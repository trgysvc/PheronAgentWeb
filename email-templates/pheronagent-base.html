<!--
  PheronAgent — Kit (ConvertKit) custom HTML email template
  Brand tokens sourced from src/app/globals.css:
    dark      #06060a   (used here as text color, not background — see note below)
    secondary #86868b
    accent    #00f2fe   (cyan)
  Logo hosted at: https://pheronagent.com/assets/PheronAgentLOGO2.png

  Layout is table-based on purpose: Outlook desktop (Word rendering engine) does not
  support flexbox/grid/CSS background gradients reliably. A light page background with
  a white content card is used instead of the site's full-black theme — a solid dark
  background email renders inconsistently across Gmail/Outlook dark-mode inversion and
  looks broken more often than a light one. The cyan accent is kept as the one
  unmistakably-PheronAgent element (button fill + top rule), so the mail still reads as
  "from PheronAgent" without fighting client dark-mode overrides.

  Required by Kit: {{ message_content }} (where broadcast body is injected),
  {{ unsubscribe_link }}, {{ address }} (set your mailing address in Kit account
  settings or this renders blank).
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PheronAgent</title>
<style>
  body, table, td { margin:0; padding:0; }
  body { background-color:#f5f5f7; -webkit-text-size-adjust:100%; }
  img { border:0; display:block; }
  a { color:#00b4c4; }

  .content-text p { margin:0 0 16px 0; }
  .content-text a { color:#00b4c4; text-decoration:underline; }
  .content-text h1, .content-text h2, .content-text h3 {
    font-family:'Outfit', 'Segoe UI', Helvetica, Arial, sans-serif;
    color:#06060a;
    margin:28px 0 12px 0;
  }
  .content-text ul, .content-text ol { margin:0 0 16px 0; padding-left:20px; }

  .btn {
    display:inline-block;
    background-color:#00f2fe;
    color:#06060a !important;
    font-weight:700;
    text-decoration:none;
    padding:14px 28px;
    border-radius:8px;
    font-size:15px;
  }

  @media (max-width: 620px) {
    .container { width:100% !important; }
    .px { padding-left:24px !important; padding-right:24px !important; }
  }
</style>
</head>
<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f7;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0"
               style="width:600px; max-width:600px; background-color:#ffffff; border-radius:16px; overflow:hidden; border:1px solid #e5e5ea;">

          <!-- top accent rule -->
          <tr>
            <td style="height:4px; background-color:#00f2fe; line-height:4px; font-size:0;">&nbsp;</td>
          </tr>

          <!-- header / logo -->
          <tr>
            <td align="center" style="padding:36px 24px 24px 24px;">
              <a href="https://pheronagent.com" target="_blank">
                <img src="https://pheronagent.com/assets/PheronAgentLOGO2.png" width="40" height="40" alt="PheronAgent" style="border-radius:9px;">
              </a>
              <div style="font-family:'Outfit','Segoe UI',Helvetica,Arial,sans-serif; font-size:15px; font-weight:700; color:#06060a; letter-spacing:0.2px; margin-top:10px;">
                PheronAgent
              </div>
            </td>
          </tr>

          <tr>
            <td class="px" style="padding:0 24px;">
              <hr style="border:none; border-top:1px solid #e5e5ea; margin:0;">
            </td>
          </tr>

          <!-- body content -->
          <tr>
            <td class="px content-text"
                style="padding:32px 40px; font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif; font-size:15px; line-height:1.65; color:#1d1d1f;">
              {{ message_content }}
            </td>
          </tr>

          <tr>
            <td class="px" style="padding:0 24px;">
              <hr style="border:none; border-top:1px solid #e5e5ea; margin:0;">
            </td>
          </tr>

          <!-- footer -->
          <tr>
            <td class="px" align="center" style="padding:24px 24px 32px 24px; font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif; font-size:12px; line-height:1.6; color:#86868b;">
              <div style="margin-bottom:10px;">
                Privacy-first autonomous AI agents, built entirely on-device on Apple Silicon.
              </div>
              <div style="margin-bottom:10px;">
                <a href="https://pheronagent.com" style="color:#86868b; text-decoration:underline;">pheronagent.com</a>
                &nbsp;·&nbsp;
                <a href="mailto:support@pheronagent.com" style="color:#86868b; text-decoration:underline;">support@pheronagent.com</a>
              </div>
              <div style="margin-bottom:10px;">
                {{ address }}
              </div>
              <div>
                <a href="{{ unsubscribe_link }}" style="color:#86868b; text-decoration:underline;">Unsubscribe</a>
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
